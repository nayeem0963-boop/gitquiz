<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Git Command Learning App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Git Command Quiz App</h1>
    <p class="subtitle">Learn common Git commands with quizzes</p>

    

    <div class="command-grid" id="commandGrid"></div>

    <div class="quiz-section">
      <h2 style="margin-bottom:20px; color:#1f3c88;">Quick Git Quiz</h2>
      <div class="quiz-question" id="question"></div>
      <div class="quiz-options" id="options"></div>
      <div class="score" id="score"></div>
    </div>
  </div>

  <script src="script.js"> </script>
</body>
</html>
